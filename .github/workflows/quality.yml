name: Calidad multiplataforma

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Leer versiones del proyecto
        id: tools
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const t = JSON.parse(fs.readFileSync("scripts/toolchain.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${t.node}\nrust=${t.rust}\n`);'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.node }}
          cache: npm
      - name: Preparar Rust en el runner CI
        run: rustup toolchain install ${{ steps.tools.outputs.rust }} --profile minimal --component rustfmt --component clippy
      - run: rustup default ${{ steps.tools.outputs.rust }}
      - name: Prerrequisitos Linux (solo CI)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - run: npm ci
      - run: npm run release:preflight
      - name: Validar sin hardware (red explicita para preparar caches)
        run: npm run check:all -- --online
